<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CAED Unisinos – Redirecionando para novo site</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://caedunisinos.com.br/">
  <meta http-equiv="refresh" content="5;url=https://caedunisinos.com.br/">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .container {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    h1 { color: #6B0F1A; margin-bottom: 0.5rem; }
    p { color: #333; margin-bottom: 1rem; }
    .counter {
      font-size: 2rem;
      font-weight: bold;
      color: #C9A84C;
      margin: 1rem 0;
    }
    a {
      color: #6B0F1A;
      text-decoration: underline;
    }
    .note {
      font-size: 0.8rem;
      color: #777;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔁 CAED Unisinos – Novo endereço</h1>
    <p>O site do Centro Acadêmico de Direito da UNISINOS mudou para:</p>
    <p><strong>https://caedunisinos.com.br/</strong></p>
    <div class="counter">
      Redirecionando em <span id="countdown">5</span> segundos...
    </div>
    <p>Se o redirecionamento não funcionar automaticamente, <a href="https://caedunisinos.com.br/">clique aqui</a>.</p>
    <div class="note">Atualize seus favoritos. O antigo endereço será descontinuado em breve.</div>
  </div>

  <script>
    let seconds = 5;
    const countdownElement = document.getElementById('countdown');
    const interval = setInterval(() => {
      seconds--;
      countdownElement.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(interval);
        window.location.href = 'https://caedunisinos.com.br/';
      }
    }, 1000);
  </script>
</body>
</html>
